<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<meta charset="UTF-8">
<title>Eventos</title>
</head>
<body>

	<div th:replace="~{Menu :: Menu}"></div>
	<h1>Adicionar Eventos</h1>

	<form action="/eventos" method="post">

		<div>
			<label>Nome:</label> <input type="text" name="nome">
		</div>
		<div>
			<label>Local:</label> <input type="text" name="local">
		</div>
		<div>
			<label>Data:</label> <input type="text" name="data">
		</div>
		<div>
			<label>Horário:</label> <input type="text" name="horario">
		</div>
		<div>
			<button class="waves-effect waves-light btn" type="submit">Salvar</button>
		</div>
		<div>
			<button class="waves-effect waves-light btn" type="reset">Limpar</button>
		</div>
	</form>
</body>
</html>
